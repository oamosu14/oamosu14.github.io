<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelOps Evidence Gallery</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0b0f19;
  color:#e6edf3;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:60px 20px;
}

h1{
  color:#22c55e;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:30px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:15px;
}

img{
  width:100%;
  border-radius:10px;
}

nav{
  padding:15px 20px;
  background:rgba(0,0,0,0.5);
  position:sticky;
  top:0;
}

a{
  color:#22c55e;
  text-decoration:none;
  margin-right:15px;
}
</style>
</head>

<body>

<nav>
  <a href="../../index.html">⬅ Back to Portfolio</a>
  <a href="./index.html">Case Study</a>
</nav>

<div class="container">

<h1>SentinelOps Evidence Gallery</h1>

<p>Operational artifacts, dashboards, logs, and infrastructure snapshots.</p>

<div class="grid">

  <div class="card">
    <h3>Grafana Dashboard</h3>
    <img src="../../assets/images/grafana-dashboard.png">
  </div>

  <div class="card">
    <h3>CMDB Inventory</h3>
    <img src="../../assets/images/cmdb-dashboard.png">
  </div>

  <div class="card">
    <h3>Ansible Execution</h3>
    <img src="../../assets/images/ansible-run.png">
  </div>

</div>

</div>

</body>
</html>
