<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CI/CD Pipeline | Execution Console</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0b0f19;
  color:#e6edf3;
}

header{
  padding:18px;
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
}

a{
  color:#22c55e;
  text-decoration:none;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

.pipeline{
  display:flex;
  gap:10px;
  margin-top:30px;
}

.stage{
  flex:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.running{
  border-color:#22c55e;
  box-shadow:0 0 15px rgba(34,197,94,0.2);
}

.log{
  margin-top:30px;
  background:#0f172a;
  padding:15px;
  border-radius:10px;
  font-family:monospace;
  height:280px;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<header>
  <a href="../../index.html">⬅ Portfolio</a>
  <span>CI/CD Execution Pipeline</span>
</header>

<div class="container">

<h1>Jenkins-Style CI/CD Simulation</h1>
<p>Simulated build → test → security scan → deploy workflow</p>

<div class="pipeline">
  <div class="stage running" id="s1">BUILD</div>
  <div class="stage" id="s2">TEST</div>
  <div class="stage" id="s3">SECURITY SCAN</div>
  <div class="stage" id="s4">DEPLOY</div>
</div>

<div class="log" id="log"></div>

</div>

<script>

let step = 0;

const logs = document.getElementById("log");

function write(msg){
  logs.innerHTML += msg + "\n";
  logs.scrollTop = logs.scrollHeight;
}

function pipeline(){

  const stages = ["s1","s2","s3","s4"];

  if(step > 0){
    document.getElementById(stages[step-1]).classList.remove("running");
  }

  if(step < stages.length){
    document.getElementById(stages[step]).classList.add("running");
  }

  const messages = [
    "Pulling source code from Git repo...",
    "Running unit tests...",
    "Executing SAST scan (Simulated)...",
    "Deploying container to staging..."
  ];

  write("[CI/CD] " + messages[step]);

  step++;

  if(step >= stages.length){
    write("[SUCCESS] Pipeline completed successfully");
    return;
  }

  setTimeout(pipeline, 2000);
}

pipeline();

</script>

</body>
</html>
