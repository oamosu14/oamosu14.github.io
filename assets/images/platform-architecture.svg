<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">SOC-AI Forge logical architecture</title><desc id="desc">A logical flow from monitored endpoints through Wazuh to investigation and analyst workflow, with infrastructure observability and automation as supporting layers.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2e"/><stop offset="1" stop-color="#08111f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><text x="50" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">SOC-AI Forge — Logical Architecture</text>
<text x="50" y="82" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Conceptual data and workflow view; not a live topology or deployment diagram</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="50" y="145" width="220" height="105" rx="15" fill="#132338" stroke="#60a5fa"/><text x="160" y="181" fill="#93c5fd" font-size="18" font-weight="700">Endpoints</text><text x="160" y="208" fill="#e2e8f0" font-size="14">Windows + Sysmon</text><text x="160" y="230" fill="#e2e8f0" font-size="14">Ubuntu Wazuh agent</text>
<rect x="350" y="145" width="220" height="105" rx="15" fill="#132338" stroke="#22c55e"/><text x="460" y="181" fill="#86efac" font-size="18" font-weight="700">Detection</text><text x="460" y="208" fill="#e2e8f0" font-size="14">Wazuh Manager</text><text x="460" y="230" fill="#e2e8f0" font-size="14">Events + rules</text>
<rect x="650" y="145" width="220" height="105" rx="15" fill="#132338" stroke="#22c55e"/><text x="760" y="181" fill="#86efac" font-size="18" font-weight="700">Investigation</text><text x="760" y="208" fill="#e2e8f0" font-size="14">Alert triage</text><text x="760" y="230" fill="#e2e8f0" font-size="14">Evidence + context</text>
<rect x="950" y="145" width="200" height="105" rx="15" fill="#132338" stroke="#a78bfa"/><text x="1050" y="181" fill="#c4b5fd" font-size="18" font-weight="700">Analyst Workflow</text><text x="1050" y="208" fill="#e2e8f0" font-size="14">Jira SOC tickets</text><text x="1050" y="230" fill="#e2e8f0" font-size="14">Document outcomes</text>
<path d="M270 197 H340 M570 197 H640 M870 197 H940" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="345" width="430" height="112" rx="15" fill="#102238" stroke="#38bdf8"/><text x="325" y="381" fill="#7dd3fc" font-size="18" font-weight="700">Observability Layer</text><text x="325" y="410" fill="#e2e8f0" font-size="15">Prometheus • Grafana • Node Exporter</text><text x="325" y="434" fill="#94a3b8" font-size="13">Infrastructure metrics and service health</text>
<rect x="660" y="345" width="430" height="112" rx="15" fill="#102238" stroke="#f59e0b"/><text x="875" y="381" fill="#fcd34d" font-size="18" font-weight="700">Supporting Operations</text><text x="875" y="410" fill="#e2e8f0" font-size="15">Ansible • Docker • Linux administration</text><text x="875" y="434" fill="#94a3b8" font-size="13">Configuration, services, and repeatable operations</text>
<path d="M325 345 V285 H460 V260 M875 345 V285 H760 V260" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
</g></svg>